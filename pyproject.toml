[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyinfer"
version = "0.1.0"
description = "A from-scratch local inference engine for running models larger than VRAM"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["inference", "llm", "cuda", "deepseek", "qwen", "streaming", "quantization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Cuda",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# torch is deliberately not pinned here: the CUDA build has to match the local driver,
# so scripts/bootstrap.ps1 installs it with the right index URL.
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "numpy>=1.26",
    "psutil>=5.9",
]

[project.optional-dependencies]
# HTTP service layer for the OpenAI-compatible API (server.py / cli.py).
# httpx is needed by fastapi.testclient in tests/test_server.py.
server = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/Cong0707/tinyinfer"
Documentation = "https://github.com/Cong0707/tinyinfer/blob/master/docs/README.md"
Issues = "https://github.com/Cong0707/tinyinfer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tinyinfer.native" = ["*.cu"]