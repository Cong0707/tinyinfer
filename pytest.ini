[pytest]
# Only the package test suite; prototypes/ holds old kernel experiments.
testpaths = tests

# The routine gate is fast: cases that compile TileLang kernels ("kernel") or load the
# 510GB checkpoint ("slow") are opt-in.
#   scripts/check.ps1              fast gate
#   scripts/check.ps1 -Kernels     include the TileLang ones
#   pytest -m slow                 include the checkpoint-backed ones
addopts = -q --tb=short -m "not slow"

markers =
    kernel: compiles tilelang kernels (slow; opt-in via check.ps1 -Kernels)
    slow: needs the real checkpoint loaded (opt-in by overriding -m)