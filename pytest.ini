[pytest]
# Only the package test suite. prototypes/ holds old kernel experiments whose imports
# (tvm_ffi) fail on collection and are not part of the shipped engine.
testpaths = tests
addopts = -q --tb=short
# Tests marked "kernel" compile tilelang kernels on first run (minutes, gigabytes of
# compiler memory). They are not part of the fast gate: run them explicitly with
# scripts/check.ps1 -Kernels, so a routine check never pays a compile.
markers =
    kernel: compiles tilelang kernels (slow; opt-in via check.ps1 -Kernels)
